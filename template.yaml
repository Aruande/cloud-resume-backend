# associated with these triggers aren't fully specified in this template and
# include placeholder values. Open this template in AWS Infrastructure Composer
# or your favorite IDE and modify it to specify a serverless application with
# other AWS resources.
#
# - SAM automatically generates permissions to interact with the resources
#   defined in this template. If your function needs additional permissions, add
#   Policies to the AWS::Serverless::Function resource.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  cloudresumevisitorcounter:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/cloud-resume-visitor-counter
      MemorySize: 128
      PackageType: Zip
      Policies:
        - Statement:
            - Sid: UpdateVisitorCounter
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt VisitorCounterTable.Arn
      RecursiveLoop: Terminate
      Runtime: python3.14
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 3
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: HttpApi
          Properties:
            Method: POST
            Path: /visitor-count

  VisitorCounterTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: cloud-resume-visitors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
