
name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Test and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
        
      - name: Inspect GitHub OIDC identity
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("sub", "aud", "repository", "repository_id", "repository_owner_id", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841162710990:role/GitHubActionsCloudResumeBackendDeployRole
          aws-region: us-east-2

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Build backend
        run: sam build

      - name: Deploy test backend
        run: |
          sam deploy \
            --config-file samconfig.toml \
            --role-arn arn:aws:iam::841162710990:role/CloudResumeBackendCloudFormationExecutionRole \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
